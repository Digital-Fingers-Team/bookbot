services:
  mongo:
    # Atlas Local bundles mongod with mongot, which provides local
    # MongoDB Search and Vector Search for development.
    image: mongodb/mongodb-atlas-local:preview
    hostname: mongo
    container_name: aradobotd-mongo
    restart: unless-stopped
    # Root credentials (D-27, 2026-09-26). With them set the image enforces
    # auth; the users already exist. The app uses its own readWrite user.
    env_file: .mongo-root.env
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - aradobotd-mongo-data:/data/db
      - aradobotd-mongo-config:/data/configdb
      - aradobotd-mongo-mongot:/data/mongot
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  aradobotd-mongo-data:
  aradobotd-mongo-config:
  aradobotd-mongo-mongot:
